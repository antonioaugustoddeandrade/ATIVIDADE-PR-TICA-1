    - "10.1111/j.1537-2995.2012.03810.x"
    - "10.1590/s0103-21002010000100011"
    - "10.1111/j.1537-2995.2007.01409.x"
    - "10.1111/tme.12249"
    - "10.1590/s0034-89102010000100012"
    - "10.1111/trf.13874"
    - "10.1111/j.1537-2995.2007.01331.x"
