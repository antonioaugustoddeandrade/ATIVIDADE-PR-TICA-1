  revista_alvo: Transfusion

estudo:
  objetivo: >-
    Sintetizar evidências sobre a frequência e os preditores da depleção de ferro
    em doadores de sangue, o desempenho da hemoglobina como critério de aptidão,
    o efeito de intervalos entre doações e de estratégias de reposição de ferro,
    e as implicações para a triagem clínica realizada pela enfermagem.
  hipoteses:
    - >-
      H1 (direcional, síntese): intensidade de doação e intervalo curto entre
      coletas associam-se a estoques de ferro ausentes, eritropoese ferropriva
      e inaptidão por hemoglobina baixa, para além do efeito isolado de sexo e idade.
    - >-
      H2 (direcional, síntese): suplementação de ferro direcionada — e não o uso
      universal não monitorado — reduz inaptidão por hemoglobina baixa e acelera
      a recuperação de estoques, com eventos adversos que limitam a adesão.
    - >-
      H3 (conceitual): a triagem clínica de enfermagem é o ponto operacional em
      que erro de medida, explicação da inaptidão e encaminhamento para reposição
      ou alongamento de intervalo precisam ser articulados.
  tipo_estudo: Revisão narrativa da literatura (síntese qualitativa de evidências)
  amostra: >-
    Corpus de artigos de periódico com DOI validado via CrossRef (2001–2020),
    cobrindo coortes de estoques de ferro, ensaios de suplementação, uma revisão
    Cochrane, um ensaio de intervalo entre doações, estudos brasileiros de
    hemocentros e um estudo de competências de enfermagem na triagem clínica.
  instrumentos:
    - Protocolo de curadoria narrativa e validação de DOIs na API CrossRef
    - Extração de estimativas tal como publicadas nos resumos e conclusões das fontes
    - Checklist de coerência metodológica e de correspondência citação–referência
  procedimentos: >-
    (1) definição da pergunta e das hipóteses de síntese; (2) seleção e validação
    de DOIs; (3) leitura e síntese por eixos (prevalência e preditores, medida e
    inaptidão, intervalo entre doações, reposição, algoritmos de serviço,
    triagem de enfermagem); (4) verificação de citações e formatação APA 7;
    (5) checagem heurística de originalidade.
  analises: >-
    Síntese narrativa por eixos, sem meta-análise própria. Razões de risco,
    médias e proporções são reproduzidas apenas quando explicitadas nas fontes
    recuperadas. Não se imputaram valores ausentes nem se recalcularam intervalos
    de confiança.
  principais_achados_resumidos:
    - >-
      Doadores frequentes apresentam alta proporção de estoques de ferro ausentes
      e de eritropoese ferropriva; sexo, idade, menstruação e intensidade de doação
      são preditores reiterados.
    - >-
      A hemoglobina isolada deixa passar deficiência sem anemia e sofre efeito de
      horário, estação e método de medida, com inaptidões que a dosagem automatizada
      não confirma.
    - >-
      Ferro oral em dose baixa acelera a recuperação da hemoglobina; a revisão
      Cochrane estima redução da inaptidão, acompanhada de mais eventos adversos.
    - >-
      Intervalos mais curtos aumentam a coleta e também a deficiência de ferro.
      Algoritmos com ferritina e reposição dirigida elevaram a hemoglobina em serviço.
    - >-
      A enfermeira que realiza a triagem clínica é quem informa a causa provável
      da inaptidão e encaminha a conduta de ferro.
